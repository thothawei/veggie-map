name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Pint / PHPStan / PHPUnit)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: veggiemap_testing
          MYSQL_USER: veggiemap
          MYSQL_PASSWORD: veggiemap
          MYSQL_ROOT_PASSWORD: veggiemap_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # Redis 原本不需要（phpunit.xml 用 CACHE_STORE=array、QUEUE_CONNECTION=sync），
    # 但 AI Office 的 /health 是 readiness 檢查，會真的 Redis::ping()——沒有這個 service
    # 就固定回 503，HealthTest 全紅（main 從 6043905 起就是這樣）。本機有 docker-compose
    # 的 redis 所以測得過，乾淨 checkout 才會炸，正是 CI 要抓的那類問題。
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: veggiemap_testing
      DB_USERNAME: veggiemap
      DB_PASSWORD: veggiemap
      # .env.example 寫的是 docker-compose 的服務名 `redis`，在 CI 解析不到。
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # redis 是 ext-redis（phpredis）：REDIS_CLIENT 預設 phpredis，composer 沒裝
          # predis，所以少了這個擴充 Redis::connection() 會直接丟例外，AI Office 的
          # readiness 檢查固定回 503。本機 docker 映像有裝，CI 之前沒有。
          extensions: pdo_mysql, mbstring, bcmath, gd, zip, redis
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Build frontend assets
        # `/` 現在是 Vue SPA shell（見 resources/views/app.blade.php），render 這個 view
        # 需要 public/build/manifest.json，否則任何打 `/` 的 Feature test（例如
        # tests/Feature/ExampleTest.php）都會在全新 checkout 上炸 ViteManifestNotFoundException。
        run: |
          npm ci
          npm run build

      - name: Laravel Pint (style check)
        run: ./vendor/bin/pint --test

      - name: PHPStan (Larastan)
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -uveggiemap -pveggiemap --silent && break
            sleep 2
          done

      - name: Run migrations
        run: php artisan migrate --force

      # ubuntu runner 本身就有 docker，所以 AI Office 的沙箱整合測試在 CI 會真的
      # 把容器跑起來（本機 app container 裡沒有 docker CLI，那邊是 skip）。先 pull
      # 好映像：不 pull 的話第一個測試要在自己的逾時內完成下載，失敗時看起來會像
      # 「沙箱壞了」而不是「網路慢」。
      - name: Pre-pull the sandbox image
        run: docker pull alpine:3.20

      - name: PHPUnit
        run: php artisan test

  frontend:
    name: Frontend (ESLint / TypeScript / Vitest / Build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Vitest
        run: npm run test

      - name: Build
        run: npm run build

  docker:
    name: Docker (compose config / image build / extensions)
    runs-on: ubuntu-latest

    # backend／frontend 兩個 job 跑的是 runner 上的 PHP 與 Node，碰不到
    # docker/php/Dockerfile。這個 job 補的就是那個洞：Dockerfile 或 compose 壞掉
    # 之前 CI 完全不會紅，只有下一個 `docker compose up -d` 的人會踩到。
    steps:
      - uses: actions/checkout@v4

      # compose 語法 + 服務參照。sandbox 那份是覆蓋檔（只有 app／horizon 兩段），
      # 必須疊在 base 上才驗得到，單獨 config 會因為缺 image/build 而失敗。
      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.sandbox.yml config -q

      - uses: docker/setup-buildx-action@v3

      - name: Build the PHP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          load: true
          tags: veggiemap-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # build 成功不等於映像可用：apt/pecl 的步驟就算跑完，擴充仍可能沒被 enable。
      # 這串正是 app container 真的需要的——少了 redis，AI Office 的 readiness
      # 檢查會固定回 503（見上面 backend job 的註解，那個洞就是這樣來的）。
      - name: Verify required PHP extensions
        run: |
          docker run --rm veggiemap-app:ci php -m | tr -d '\r' > extensions.txt
          missing=""
          for ext in pdo_mysql mbstring bcmath gd zip redis pcntl exif; do
            grep -qx "$ext" extensions.txt || missing="$missing $ext"
          done
          if [ -n "$missing" ]; then
            echo "映像缺少擴充:$missing"
            exit 1
          fi
          echo "八個擴充都在"

      - name: Verify composer is available in the image
        run: docker run --rm veggiemap-app:ci composer --version
